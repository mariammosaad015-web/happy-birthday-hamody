<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Last Page</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#FFE9CC;font-family:'Aref Ruqaa',serif;overflow:hidden}
#intro,#credits{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000}
#introText{font-size:46px;color:#fff;opacity:0;transition:1.5s}
#page{display:none;position:fixed;inset:0;overflow-y:auto;padding:60px}
#content{max-width:900px;margin:auto;font-size:30px;line-height:2.15;white-space:pre-wrap}
#title{font-size:42px;color:#ff7300;text-align:center;margin-bottom:35px}
#love{text-align:center;color:#ff7300;font-size:44px;margin:60px 0;display:none}
#credits{display:none;opacity:0;transition:2s}
#made{font:20px Arial;color:#ff7300;letter-spacing:8px;margin-bottom:30px}
#signature{width:220px;opacity:.95}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#ff7300;border-radius:20px}
</style>
</head>
<body>
<div id="intro"><div id="introText"></div></div>
<div id="page"><div id="content"><div id="title">إلى حبيبي مستر أحمد مجدي 🧡</div><div id="msg"></div><div id="love"></div></div></div>
<div id="credits"><div id="made">MADE BY</div><img id="signature" src="signature.png" alt="signature"></div>
<script>
const text=`بقالي أكتر من 10 أيام بتعلم إزاي أعمل الموقع ده...

عشان تبقى ذكرى لينا نتفرج عليها لما نكبر.

تفتكر يا أحمد هنكبر سوا فعلًا؟

هيبقى عندنا بيت...
وعيلة...
وحياة خاصة بينا...
إحنا بس.

هنجيب بيت وانت عندك 25 سنة...
ونعمله كله لونه برتقالي...
وتكييف مركزي؟ 🧡

ولا القدر هيكون ليه رأي تاني...
ويقرر يقسم أحلامنا على اتنين...
وكل واحد يرجع لوحده...
تايه.

اليوم أتممت عامك الـ22...
أدام الله عليك الصحة...
والرضا...
والهدوء.

ولو كان ليا الحظ إني أشاركك أعياد ميلادك الجاية...
هفكرك دايمًا بأحلامنا...
في سن الـ22 والـ20.

شكراً إنك جنبي.
وشكراً إنك...
حبيبي  أحمد .
حبيبي  أحمد  بس 🧡

"إلىٰ مَنْ يَطِيبُ بِهِ العُمْرُ،
وتَسْكُنُ إِلَيْهِ الرُّوحُ.
وإلى مَن علّمني الحب."`;

const intro=document.getElementById('introText');
setTimeout(()=>{intro.textContent='قبل ما تقرأ...';intro.style.opacity=1;},700);
setTimeout(()=>intro.style.opacity=0,3200);
setTimeout(()=>{intro.textContent='في حاجة أخيرة حابة أقولها لك.';intro.style.opacity=1;},5000);
setTimeout(()=>intro.style.opacity=0,8300);
setTimeout(()=>{
document.getElementById('intro').style.display='none';
document.getElementById('page').style.display='block';
let i=0;
function type(){
 if(i<text.length){
   document.getElementById('msg').textContent+=text[i++];
   document.getElementById('page').scrollTop=document.getElementById('page').scrollHeight;
   setTimeout(type,55);
 }else{
   setTimeout(love,1200);
 }
}
type();
},9800);
function love(){
const t="بحبك 🧡"; let i=0; let e=document.getElementById('love'); e.style.display='block';
(function w(){ if(i<t.length){e.textContent+=t[i++]; setTimeout(w,180);} else setTimeout(end,4000);})();
}
function end(){
document.getElementById('page').style.opacity=0;
setTimeout(()=>{
document.getElementById('page').style.display='none';
let c=document.getElementById('credits');
c.style.display='flex';
setTimeout(()=>c.style.opacity=1,100);
},1700);
}
</script>
</body></html>
