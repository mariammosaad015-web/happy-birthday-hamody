<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The End 🧡</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

background:#000;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

font-family:'Aref Ruqaa',serif;

color:#ffe9cc;

}



#end{

font-size:65px;

opacity:0;

transition:2s;

color:white;

text-align:center;

}



#letter{

display:none;

width:90%;

max-width:750px;

height:85vh;

overflow-y:auto;

text-align:center;

padding:20px;

font-size:30px;

line-height:2.2;

color:#ffe9cc;

}



#title{

font-size:45px;

color:#ff7300;

margin-bottom:35px;

}



#text{

white-space:pre-line;

}



.cursor{

border-left:3px solid #ff7300;

}



#love{

margin-top:40px;

font-size:45px;

color:#ff7300;

}



.show{

opacity:1 !important;

}



</style>

</head>



<body>


<div id="end">
The End 🧡
</div>



<div id="letter">


<div id="title">
إلى حبيبي مستر أحمد مجدي 🧡
</div>


<div id="text"></div>


<div id="love">
بحبك <span>♥</span>
</div>



</div>





<script>


const end=document.getElementById("end");

const letter=document.getElementById("letter");

const text=document.getElementById("text");



const message=`

بقالي أكتر من 10 أيام بتعلم إزاي أعمل الموقع ده...

عشان يبقى ذكرى لينا.

ذكرى نتفرج عليها لما نكبر ونفتكر الأيام دي.

تفتكر يا أحمد هنكبر سوا فعلًا؟

هيبقى عندنا بيت وعيلة وحياة خاصة بينا...

إحنا بس.

هنجيب بيت وانت عندك 25 سنة،
ونعمله كله لونه برتقالي،
وتكييف مركزي؟ 🧡

ولا القدر هيكون ليه رأي تاني؟

ويقرر يقسم الأحلام بتاعتنا على 2...

وكل واحد يرجع لوحده تاني تايه.

اليوم أتممت عامك الـ22،
أدام الله عليك الصحة والرضا والهدوء.

ولو كان ليا الحظ إني أشاركك ذكرى أيام ميلادك الجاية...

هفكرك دايمًا بأحلامنا دلوقتي،
في سن الـ22 والـ20.

شكرًا إنك جنبي.

وشكرًا إنك أحمد.

أحمد بس 🧡


"إلىٰ مَنْ يَطِيبُ بِهِ العُمْرُ،
وتَسْكُنُ إِلَيْهِ الرُّوحُ.

وإلى مَن علّمني الحب"


`;



setTimeout(()=>{

end.style.opacity="1";

},500);



setTimeout(()=>{

end.style.opacity="0";


},3500);



setTimeout(()=>{


end.style.display="none";


letter.style.display="block";



let i=0;


function typing(){


if(i < message.length){


text.innerHTML += message.charAt(i);


i++;


setTimeout(typing,65);


}


}



typing();



},4500);



</script>



</body>

</html>
