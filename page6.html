<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;
overflow:hidden;
font-family:'Aref Ruqaa',serif;

}

/* ===============================
   شاشة البداية
=============================== */

#intro{

position:fixed;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;

}

#intro1,#intro2{

position:absolute;

font-size:48px;

color:#ffffff;

opacity:0;

transition:opacity 1.5s ease;

text-align:center;

padding:20px;

}

/* ===============================
   الورقة
=============================== */

#letter{

display:none;

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%) scale(.92);

opacity:0;

width:min(900px,92vw);

height:82vh;

background:#FFF3E3;

border-radius:25px;

padding:45px;

box-shadow:0 15px 45px rgba(0,0,0,.45);

overflow-y:auto;

transition:1.5s;

}

#letter.show{

opacity:1;

transform:translate(-50%,-50%) scale(1);

}

#letter h1{

text-align:center;

font-size:42px;

color:#ff7300;

margin-bottom:35px;

}

#message{

font-size:30px;

line-height:2.15;

color:#5b402b;

white-space:pre-wrap;

}

#love{

display:none;

margin-top:55px;

text-align:center;

font-size:44px;

color:#ff7300;

}

/* ===============================
   النهاية
=============================== */

#credits{

display:none;

position:fixed;

inset:0;

background:#000;

justify-content:center;

align-items:center;

flex-direction:column;

opacity:0;

transition:2s;

}

#made{

font-family:Arial;

font-size:20px;

letter-spacing:8px;

color:#ff7300;

margin-bottom:35px;

}

#signature{

width:250px;

height:250px;

display:flex;

justify-content:center;

align-items:center;

}

/* هنا هنحط صورة التوقيع بعدين */

#signature img{

width:100%;

opacity:0;

transform:translateY(20px);

transition:2s;

}

/* Scroll */

::-webkit-scrollbar{

width:8px;

}

::-webkit-scrollbar-thumb{

background:#ff7300;

border-radius:20px;

}

::-webkit-scrollbar-track{

background:transparent;

}

</style>

</head><body>

<!-- شاشة البداية -->

<div id="intro">

    <div id="intro1">
        قبل ما تقرأ...
    </div>

    <div id="intro2">
        في حاجة أخيرة حابة أقولها لك.
    </div>

</div>


<!-- الرسالة -->

<div id="letter">

    <h1>
        إلى حبيبي مستر أحمد مجدي 🧡
    </h1>

    <div id="message"></div>

    <div id="love"></div>

</div>


<!-- شاشة النهاية -->

<div id="credits">

    <div id="made">
        MADE BY
    </div>

    <div id="signature">

        <!-- هنضيف صورة التوقيع هنا بعدين -->

        <img id="signatureImg" src="" alt="signature">

    </div>

</div>


<script>

const intro = document.getElementById("intro");
const intro1 = document.getElementById("intro1");
const intro2 = document.getElementById("intro2");

const letter = document.getElementById("letter");
const messageBox = document.getElementById("message");

const love = document.getElementById("love");

const credits = document.getElementById("credits");
const signatureImg = document.getElementById("signatureImg");

const message = `

بقالي أكتر من 10 أيام بتعلم إزاي أعمل الموقع ده...

عشان يبقى ذكرى لينا.

ذكرى نتفرج عليها لما نكبر ونفتكر الأيام دي.

تفتكر يا أحمد هنكبر سوا فعلًا؟

هيبقى عندنا بيت وعيلة وحياة خاصة بينا...

إحنا بس.

هنجيب بيت وانت عندك 25 سنة،
ونعمله كله لونه برتقالي،
وتكييف مركزي؟ 🧡

ولا القدر هيكون ليه رأي تاني؟

ويقرر يقسم الأحلام بتاعتنا على 2...

وكل واحد يرجع لوحده تاني تايه.

اليوم أتممت عامك الـ22،
أدام الله عليك بالصحة والرضا والهدوء.

ولو كان ليا الحظ إني أشاركك ذكرى أيام ميلادك الجاية...

هفكرك دايمًا بأحلامنا دلوقتي،
في سن الـ22 والـ20.

شكراً إنك جنبي.

وشكراً إنك حبيبي مستر أحمد مجدي.

حبيبي مستر أحمد مجدي بس 🧡

"إلىٰ مَنْ يَطِيبُ بِهِ العُمْرُ،
وتَسْكُنُ إِلَيْهِ الرُّوحُ.

وإلى مَن علّمني الحب."

`;/* ===========================
   شاشة البداية
=========================== */

setTimeout(() => {
    intro1.style.opacity = "1";
}, 800);

setTimeout(() => {
    intro1.style.opacity = "0";
}, 2800);

setTimeout(() => {
    intro2.style.opacity = "1";
}, 4300);

setTimeout(() => {
    intro2.style.opacity = "0";
}, 7000);

setTimeout(() => {

    intro.style.display = "none";

    letter.style.display = "block";

    setTimeout(() => {

        letter.classList.add("show");

        startTyping();

    }, 150);

}, 7900);



/* ===========================
   كتابة الرسالة
=========================== */

function startTyping(){

let i = 0;

function type(){

if(i < message.length){

messageBox.innerHTML += message.charAt(i);

letter.scrollTop = letter.scrollHeight;

i++;

setTimeout(type,38);

}

else{

setTimeout(writeLove,900);

}

}

type();

}



/* ===========================
   كتابة بحبك
=========================== */

function writeLove(){

love.style.display="block";

const txt="بحبك 🧡";

let x=0;

love.innerHTML="";

function write(){

if(x<txt.length){

love.innerHTML += txt.charAt(x);

x++;

setTimeout(write,220);

}

else{

setTimeout(showCredits,3500);

}

}

write();

}



/* ===========================
   شاشة النهاية
=========================== */

function showCredits(){

letter.style.opacity="0";

letter.style.transform="translate(-50%,-50%) scale(.95)";

setTimeout(()=>{

letter.style.display="none";

credits.style.display="flex";

setTimeout(()=>{

credits.style.opacity="1";

signatureImg.style.opacity="1";

signatureImg.style.transform="translateY(0px)";

},200);

},1700);

}

</script>

</body>

</html>
