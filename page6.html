<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;
overflow:hidden;
font-family:'Aref Ruqaa',serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

/* ==========================
   شاشة البداية
========================== */

#intro{

position:fixed;
inset:0;
background:#000;

display:flex;
justify-content:center;
align-items:center;

z-index:9999;

}

#introText{

font-size:48px;
color:#ffffff;
text-align:center;
opacity:0;
transition:1.5s;

}

/* ==========================
   الرسالة
========================== */

#messageBox{

display:none;

position:fixed;

inset:0;

padding:70px;

overflow:hidden;

background:#000;

color:#FFE9CC;

font-size:31px;

line-height:2.2;

white-space:pre-wrap;

opacity:0;

transition:1.8s;

}

#message{

width:min(900px,92vw);

margin:auto;

}

/* ==========================
   بحبك
========================== */

#love{

display:none;

text-align:center;

margin-top:70px;

font-size:45px;

color:#ff7300;

}

/* ==========================
   النهاية
========================== */

#credits{

display:none;

position:fixed;

inset:0;

background:#000;

justify-content:center;
align-items:center;
flex-direction:column;

opacity:0;

transition:2s;

}

#made{

font-family:Arial;

font-size:22px;

letter-spacing:8px;

color:#ff7300;

margin-bottom:35px;

}

#signature{

width:230px;

opacity:0;

transform:translateY(20px);

transition:2s;

}

/* Scroll */

::-webkit-scrollbar{
display:none;
}

</style>

</head>

<body>

<!-- شاشة البداية -->

<div id="intro">

<div id="introText"></div>

</div>

<!-- الرسالة -->

<div id="messageBox">

<div id="message"></div>

<div id="love"></div>

</div>

<!-- النهاية -->

<div id="credits">

<div id="made">

MADE BY

</div>

<img id="signature" src="" alt="Signature">

</div><script>

const intro=document.getElementById("intro");
const introText=document.getElementById("introText");

const messageBox=document.getElementById("messageBox");
const message=document.getElementById("message");

const love=document.getElementById("love");

const credits=document.getElementById("credits");
const signature=document.getElementById("signature");

/* حطي هنا صورة التوقيع بعدين */
signature.src="signature.png";

/* الرسالة */

const text=`إلى حبيبي مستر أحمد مجدي 🧡

بقالي أكتر من 10 أيام بتعلم إزاي أعمل الموقع ده...

عشان تبقى ذكرى لينا نتفرج عليها لما نكبر.

تفتكر يا أحمد هنكبر سوا فعلًا؟

هيبقى عندنا بيت...

وعيلة...

وحياة خاصة بينا...

إحنا بس.

هنجيب بيت وانت عندك 25 سنة...

ونعمله كله لونه برتقالي...

وتكييف مركزي؟

🧡

ولا القدر هيكون ليه رأي تاني...

ويقرر يقسم أحلامنا على اتنين...

وكل واحد يرجع لوحده...

تايه.

اليوم أتممت عامك الـ22...

أدام الله عليك الصحة...

والرضا...

والهدوء.

ولو كان ليا الحظ إني أشاركك أعياد ميلادك الجاية...

هفكرك دايمًا بأحلامنا...

في سن الـ22 والـ20.

شكرًا إنك جنبي.

وشكرًا إنك...

حبيبي مستر أحمد مجدي.

حبيبي مستر أحمد مجدي بس 🧡

"إلىٰ مَنْ يَطِيبُ بِهِ العُمْرُ،

وتَسْكُنُ إِلَيْهِ الرُّوحُ.

وإلى مَن علّمني الحب."`;


/* البداية */

setTimeout(()=>{

introText.innerHTML="قبل ما تقرأ...";
introText.style.opacity="1";

},800);


setTimeout(()=>{

introText.style.opacity="0";

},3300);


setTimeout(()=>{

introText.innerHTML="في حاجة أخيرة حابة أقولها لك.";
introText.style.opacity="1";

},5200);


setTimeout(()=>{

introText.style.opacity="0";

},8500);


setTimeout(()=>{

intro.style.display="none";

messageBox.style.display="block";

setTimeout(()=>{

messageBox.style.opacity="1";
startTyping();

},200);

},9800);


/* كتابة الرسالة */

function startTyping(){

let i=0;

function type(){

if(i<text.length){

message.innerHTML+=text.charAt(i);

window.scrollTo(0,document.body.scrollHeight);

i++;

setTimeout(type,58);

}

else{

setTimeout(writeLove,1200);

}

}

type();

}


/* كتابة بحبك */

function writeLove(){

love.style.display="block";

love.innerHTML="";

const txt="بحبك 🧡";

let i=0;

function type(){

if(i<txt.length){

love.innerHTML+=txt.charAt(i);

i++;

setTimeout(type,180);

}

else{

setTimeout(showCredits,4000);

}

}

type();

}


/* النهاية */

function showCredits(){

messageBox.style.opacity="0";

setTimeout(()=>{

messageBox.style.display="none";

credits.style.display="flex";

setTimeout(()=>{

credits.style.opacity="1";

signature.style.opacity="1";
signature.style.transform="translateY(0px)";

},200);

},1700);

}

</script>

</body>
</html>
