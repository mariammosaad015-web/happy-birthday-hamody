<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Puzzle ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#FFE9CC,#FFD7A8);
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
overflow:hidden;
}


h1{
color:#ff7300;
margin-bottom:25px;
text-align:center;
}


#board{

width:min(420px,90vw);
height:min(420px,90vw);

display:grid;

grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,1fr);

gap:3px;

background:white;

padding:3px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

}


.piece{

background-image:url("us.png");

background-size:400% 400%;

cursor:pointer;

border-radius:3px;

transition:.2s;

}


.piece:hover{

transform:scale(.96);

}


.selected{

outline:4px solid #ff7300;

}



#finish{

display:none;

text-align:center;

margin-top:25px;

}



#finish h2{

color:#ff7300;

margin-bottom:20px;

}



button{

padding:15px 35px;

border:none;

border-radius:30px;

background:#ff7300;

color:white;

font-size:20px;

cursor:pointer;

}



#videoBox{

display:none;

position:fixed;

inset:0;

background:black;

z-index:999;

justify-content:center;

align-items:center;

}



#video{

width:100%;

height:100%;

object-fit:contain;

}


</style>

</head>


<body>


<h1>Complete the Puzzle 🧩</h1>


<div id="board"></div>



<div id="finish">

<h2>You unlocked my last gift ❤️</h2>

<button id="play">
Open it 🎁
</button>

</div>



<div id="videoBox">

<video id="video" controls playsinline>

<source src="https://drive.google.com/uc?export=download&id=1j_b9iD3rvk9QC86mZY-aa7CAVavl9ZQ1" type="video/mp4">
</video>

</div>



<script>

const board=document.getElementById("board");
const finish=document.getElementById("finish");
const play=document.getElementById("play");
const videoBox=document.getElementById("videoBox");
const video=document.getElementById("video");


let pieces=[];


for(let y=0;y<4;y++){

for(let x=0;x<4;x++){

pieces.push({

x:x,

y:y

});

}

}



do{

pieces.sort(()=>Math.random()-0.5);

}

while(

pieces.every((piece,index)=>

piece.x===index%4 &&
piece.y===Math.floor(index/4)

)

);



let selected=null;



function draw(){

board.innerHTML="";


pieces.forEach((piece,index)=>{


let div=document.createElement("div");


div.className="piece";


div.style.backgroundPosition=

(piece.x*33.333)+"% "+(piece.y*33.333)+"%";



if(selected===index){

div.classList.add("selected");

}



div.onclick=function(){

if(selected===null){

selected=index;

}

else{

swap(selected,index);

selected=null;

checkWin();

}


draw();

};



board.appendChild(div);


});


}



function swap(a,b){

let temp=pieces[a];

pieces[a]=pieces[b];

pieces[b]=temp;

}




function checkWin(){

let win=true;


pieces.forEach((piece,index)=>{


if(

piece.x!==index%4 ||

piece.y!==Math.floor(index/4)

){

win=false;

}


});


if(win){

finish.style.display="block";

}


}




draw();




play.onclick=function(){


board.style.display="none";

finish.style.display="none";

document.querySelector("h1").style.display="none";


videoBox.style.display="flex";


video.currentTime=0;

video.load();


video.play();


};




video.onended=function(){

window.location.href="page6.html";

};



</script>


</body>

</html>
