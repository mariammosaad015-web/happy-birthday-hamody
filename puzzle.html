<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Puzzle ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#FFE9CC,#FFD7A8);

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

overflow:hidden;

}


h1{

color:#ff7300;

margin-bottom:25px;

text-align:center;

}


#board{

width:min(420px,90vw);

height:min(420px,90vw);

display:grid;

grid-template-columns:repeat(4,1fr);

grid-template-rows:repeat(4,1fr);

gap:3px;

background:white;

padding:3px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

}


.piece{

background-image:url("us.png");

background-size:400% 400%;

cursor:pointer;

border-radius:3px;

transition:.2s;

}


.piece:hover{

transform:scale(.96);

}


.selected{

outline:4px solid #ff7300;

}


#finish{

display:none;

text-align:center;

margin-top:25px;

}


#finish h2{

color:#ff7300;

margin-bottom:20px;

}


button{

padding:15px 35px;

border:none;

border-radius:30px;

background:#ff7300;

color:white;

font-size:20px;

cursor:pointer;

}


#video{

display:none;

position:fixed;

inset:0;

width:100%;

height:100%;

object-fit:cover;

z-index:999;

}


</style>

</head>


<body>


<h1>
Complete the Puzzle 🧩
</h1>


<div id="board"></div>


<div id="finish">

<h2>
You unlocked my last gift ❤️
</h2>

<button id="play">
Open it 🎁
</button>

</div>


<video id="video" controls playsinline>

<source src="video.mp4" type="video/mp4">

</video>


<script>
