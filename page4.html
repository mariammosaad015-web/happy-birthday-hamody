<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch Hamody</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#FFE9CC,#FFD7A8);
overflow-x:hidden;
}

h1,p{
text-align:center;
}

#msg{
height:40px;
text-align:center;
color:#ff7300;
font-weight:bold;
font-size:20px;
}

#cat{
position:absolute;
width:min(180px,35vw);
left:50%;
top:55%;
transform:translate(-50%,-50%);
cursor:pointer;
transition:.25s;
}

#gallery{
display:none;
width:90%;
max-width:900px;
margin:20px auto;
grid-template-columns:repeat(3,1fr);
gap:18px;
padding:15px;
}

#gallery img{
width:100%;
height:190px;
object-fit:cover;
border-radius:20px;
cursor:pointer;
transition:.35s;
box-shadow:0 8px 18px rgba(0,0,0,.15);
}

#gallery img:hover{
transform:scale(1.05);
}

#continue{
display:none;
margin:30px auto;
padding:14px 35px;
border:none;
border-radius:30px;
background:#ff7300;
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}

#continue:hover{
transform:scale(1.05);
}

#viewer{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:999;
}

#viewer img{
max-width:90%;
max-height:90%;
border-radius:25px;
}

@media(max-width:700px){

#gallery{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

#gallery img{
height:150px;
}

}

</style>

</head>

<body>

<h1>Catch Hamody!</h1>

<p>Catch me if you can...</p>

<div id="msg"></div>

<img id="cat" src="runcat.png">

<div id="gallery">

<img src="photo1.png">
<img src="photo2.png">
<img src="photo3.png">
<img src="photo4.png">
<img src="photo5.png">
<img src="photo6.png">
<img src="photo7.png">
<img src="photo8.png">
<img src="photo9.png">

</div>

<button id="continue">

Continue ❤️

</button>

<div id="viewer">

<img id="bigImage">

</div>

<script>const cat=document.getElementById("cat");
const msg=document.getElementById("msg");
const gallery=document.getElementById("gallery");
const btn=document.getElementById("continue");

let step=0;

const positions=[
[50,55],
[12,18],
[82,18],
[18,75],
[80,75]
];

const texts=[
"Too slow... 😜",
"Not yet... 😂",
"You're getting closer... 👀",
"One more try... ❤️"
];

function moveCat(i){

cat.style.left=positions[i][0]+"%";
cat.style.top=positions[i][1]+"%";

}

moveCat(0);

cat.onclick=function(){

if(step<4){

msg.innerHTML=texts[step];

step++;

moveCat(step);

}

else{

msg.innerHTML="❤️ You caught me ❤️";

cat.style.transform="translate(-50%,-50%) scale(1.3)";

setTimeout(()=>{

cat.style.display="none";

document.querySelector("h1").style.display="none";

document.querySelector("p").style.display="none";

msg.style.display="none";

gallery.style.display="grid";

btn.style.display="block";

},1200);

}

};const viewer=document.getElementById("viewer");
const bigImage=document.getElementById("bigImage");

const photos=document.querySelectorAll("#gallery img");

photos.forEach(photo=>{

photo.onclick=function(){

bigImage.src=this.src;

viewer.style.display="flex";

}

});

viewer.onclick=function(){

viewer.style.display="none";

}

// زر الاستمرار
btn.onclick=function(){

window.location.href="puzzle.html";

}

</script>

</body>
</html>
