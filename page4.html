<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch Hamody</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#FFE9CC,#FFD7A8);
overflow-x:hidden;
}

h1,p{
text-align:center;
}

#msg{
height:40px;
text-align:center;
color:#ff7300;
font-weight:bold;
font-size:20px;
}

#cat{
position:absolute;
width:min(180px,35vw);
left:50%;
top:55%;
transform:translate(-50%,-50%);
cursor:pointer;
transition:.25s;
}

#gallery{
display:none;
width:90%;
max-width:900px;
margin:20px auto;
grid-template-columns:repeat(3,1fr);
gap:18px;
padding:15px;
}

#gallery img{
width:100%;
height:190px;
object-fit:cover;
border-radius:20px;
cursor:pointer;
transition:.35s;
box-shadow:0 8px 18px rgba(0,0,0,.15);
}

#gallery img:hover{
transform:scale(1.05);
}

#continue{
display:none;
margin:30px auto;
padding:14px 35px;
border:none;
border-radius:30px;
background:#ff7300;
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}

#continue:hover{
transform:scale(1.05);
}

#viewer{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:999;
}

#viewer img{
max-width:90%;
max-height:90%;
border-radius:25px;
}

@media(max-width:700px){

#gallery{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

#gallery img{
height:150px;
}

}

</style>

</head>

<body>

<h1>Catch Hamody!</h1>

<p>Catch me if you can...</p>

<div id="msg"></div>

<img id="cat" src="runcat.png">

<div id="gallery">

<img src="photo1.png">
<img src="photo2.png">
<img src="photo3.png">
<img src="photo4.png">
<img src="photo5.png">
<img src="photo6.png">
<img src="photo7.png">
<img src="photo8.png">
<img src="photo9.png">

</div>

<button id="continue">

Continue ❤️

</button>

<div id="viewer">

<img id="bigImage">

</div>

<script>const cat=document.getElementById("cat");
const msg=document.getElementById("msg");
const gallery=document.getElementById("gallery");
const btn=document.getElementById("continue");

let step=0;

const positions=[
[50,55],
[12,18],
[82,18],
[18,75],
[80,75]
];

const texts=[
"Too slow... 😜",
"Not yet... 😂",
"You're getting closer... 👀",
"One more try... ❤️"
];

function moveCat(i){

cat.style.left=positions[i][0]+"%";
cat.style.top=positions[i][1]+"%";

}

moveCat(0);

cat.onclick=function(){

if(step<4){

msg.innerHTML=texts[step];

step++;

moveCat(step);

}

else{

msg.innerHTML="❤️ You caught me ❤️";

cat.style.transform="translate(-50%,-50%) scale(1.3)";

setTimeout(()=>{

cat.style.display="none";

document.querySelector("h1").style.display="none";

document.querySelector("p").style.display="none";

msg.style.display="none";

gallery.style.display="grid";

btn.style.display="block";

},1200);

}

};const viewer=document.getElementById("viewer");
const bigImage=document.getElementById("bigImage");

const photos=document.querySelectorAll("#gallery img");

photos.forEach(photo=>{

photo.onclick=function(){

bigImage.src=this.src;

viewer.style.display="flex";

}

});

viewer.onclick=function(){

viewer.style.display="none";

}

// زر الاستمرار
btn.onclick=function(){

window.location.href="puzzle.html";

}

</script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Puzzle ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#FFE9CC,#FFD7A8);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

overflow:hidden;

}

h1{

color:#ff7300;
margin-bottom:20px;
font-size:32px;
text-align:center;

}

#board{

width:min(420px,92vw);
height:min(420px,92vw);

display:grid;

grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,1fr);

gap:2px;

background:white;

padding:2px;

border-radius:18px;

box-shadow:0 12px 35px rgba(0,0,0,.2);

}

.piece{

background-image:url("us.png");

background-size:400% 400%;

cursor:pointer;

transition:.25s;

user-select:none;

}

.piece:hover{

transform:scale(.97);

}

.selected{

outline:4px solid #ff7300;

z-index:5;

}

#finish{

display:none;

margin-top:30px;

text-align:center;

animation:fade .5s;

}

#finish h2{

color:#ff7300;

margin-bottom:18px;

font-size:30px;

}

#play{

padding:15px 38px;

border:none;

border-radius:40px;

background:#ff7300;

color:white;

font-size:20px;

cursor:pointer;

transition:.3s;

}

#play:hover{

transform:scale(1.05);

}

#video{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

object-fit:cover;

background:black;

z-index:999;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@media(max-width:600px){

h1{

font-size:26px;

}

#finish h2{

font-size:24px;

}

#play{

font-size:18px;

padding:14px 30px;

}

}

</style>

</head>

<body>

<h1>
Complete our Puzzle 🧩
</h1>

<div id="board"></div>

<div id="finish">

<h2>
You unlocked my last gift ❤️
</h2>

<button id="play">
Open it 🎁
</button>

</div>

<video id="video" controls playsinline>

<source src="video.mp4" type="video/mp4">

</video>

<script>const board = document.getElementById("board");
const finish = document.getElementById("finish");
const play = document.getElementById("play");
const video = document.getElementById("video");

let pieces = [];

for(let y=0;y<4;y++){

    for(let x=0;x<4;x++){

        pieces.push({
            x:x,
            y:y
        });

    }

}

// خلط القطع

do{

pieces.sort(()=>Math.random()-0.5);

}while(

pieces.every((piece,index)=>

piece.x===index%4 &&
piece.y===Math.floor(index/4)

)

);

let selected=null;

function draw(){

board.innerHTML="";

pieces.forEach((piece,index)=>{

const div=document.createElement("div");

div.className="piece";

div.dataset.index=index;

div.style.backgroundPosition=

(piece.x*33.333)+"% "+(piece.y*33.333)+"%";

if(selected==index){

div.classList.add("selected");

}

div.onclick=function(){

clickPiece(index);

};

board.appendChild(div);

});

}

function clickPiece(index){

if(selected===null){

selected=index;

draw();

return;

}

if(selected===index){

selected=null;

draw();

return;

}

swap(selected,index);

selected=null;

draw();

checkWin();

}

function swap(a,b){

let temp=pieces[a];

pieces[a]=pieces[b];

pieces[b]=temp;

}        function draw(){

            board.innerHTML="";

            pieces.forEach((piece,index)=>{

                const div=document.createElement("div");

                div.className="piece";

                div.style.backgroundPosition=
                (piece.x*33.333)+"% "+(piece.y*33.333)+"%";

                div.dataset.index=index;

                board.appendChild(div);

            });

            enableClick();

        }

        let selected=null;

        function enableClick(){

            document.querySelectorAll(".piece").forEach(piece=>{

                piece.onclick=function(){

                    if(selected===null){

                        selected=this.dataset.index;
                        this.style.outline="4px solid #ff7300";

                    }else{

                        if(selected!=this.dataset.index){

                            let temp=pieces[selected];
                            pieces[selected]=pieces[this.dataset.index];
                            pieces[this.dataset.index]=temp;

                        }

                        selected=null;

                        draw();

                        checkWin();

                    }

                }

            });

        }

        function checkWin(){

            let win=true;

            pieces.forEach((piece,index)=>{

                if(
                    piece.x!==index%4 ||
                    piece.y!==Math.floor(index/4)
                ){

                    win=false;

                }

            });

            if(win){

                document.getElementById("finish").style.display="block";

            }

        }

        draw();// تشغيل الفيديو
play.onclick=function(){

board.style.display="none";

finish.style.display="none";

document.querySelector("h1").style.display="none";

video.style.display="block";

video.play();

};

// بعد انتهاء الفيديو
video.onended=function(){

window.location.href="page6.html";

};

</script>

</body>
</html>
